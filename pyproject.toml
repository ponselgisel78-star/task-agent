[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "task-agent"
version = "0.1.0"
description = "Task Agent with ReAct framework and guardrails"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "requests>=2.34.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
